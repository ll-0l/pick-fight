<!-- ==================================================
     BATTLE LOG
=================================================== -->

<section id="battle-log" class="section log-section">

    <div class="section-title">

        <p>BATTLE HISTORY</p>

        <h2>BATTLE LOG</h2>

        <span>
            지금까지 치른 대결 기록
        </span>

    </div>


    <div
        class="battle-log-carousel"
        aria-label="배틀 기록"
    >

        <!-- 이전 경기 -->
        <button
            type="button"
            id="battleLogPrev"
            class="battle-log-nav battle-log-prev"
            aria-label="이전 경기 기록 보기"
            disabled
        >
            ◀
        </button>


        <!-- 가운데 카드 -->
        <div class="battle-log-viewport">

            <div
                id="battleLogList"
                class="battle-log-list"
                aria-live="polite"
            >

                <div class="empty-log">

                    <p>★</p>

                    <h3>
                        아직 전투 기록이 없습니다.
                    </h3>

                    <span>
                        첫 번째 대결을 시작해보세요.
                    </span>

                </div>

            </div>


            <!-- 2 / 5 표시 -->
            <div
                class="battle-log-pagination"
                aria-live="polite"
            >

                <span id="battleLogCurrent">
                    0
                </span>

                <span aria-hidden="true">
                    /
                </span>

                <span id="battleLogTotal">
                    0
                </span>

            </div>

        </div>


        <!-- 다음 경기 -->
        <button
            type="button"
            id="battleLogNext"
            class="battle-log-nav battle-log-next"
            aria-label="다음 경기 기록 보기"
            disabled
        >
            ▶
        </button>

    </div>

</section>
